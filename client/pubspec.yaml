name: lastsilo
description: Last Silo - klient Android
publish_to: none
version: 0.2.0+2
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  # licencje OFL czcionek (pokazywane w ekranie licencji, wymóg OFL)
  assets:
    - assets/fonts/OFL-SpaceGrotesk.txt
    - assets/fonts/OFL-Inter.txt
  # czcionki zmienne (oś wght) w paczce, bez pobierania w runtime (docs/warstwa-wizualna-v1.0.md §5)
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
