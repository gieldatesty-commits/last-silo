# Konfiguracja gry Last Silo. Wartości startowe do strojenia w symulatorze (server: npm run sim).
version: "1.1.0"

resources:
  - { id: ore, name: Ruda }
  - { id: steam, name: Para }
  - { id: tokens, name: Żetony }
  - { id: samples, name: Próbki rdzeniowe }
  - { id: miedz, name: Miedź }
  - { id: krysztal, name: Kryształy }
  - { id: siarka, name: Siarka }

economy:
  start_ore: 300
  deposit:
    local_total: 15000     # ukryta, bazowa wielkość złoża pod silosem (rudy)
    variance: 0.4          # losowanie ±40%
    floor_fraction: 0.15   # poniżej 15% złoża wydajność = 15% bazowej (ślady rudy), bez dalszego ubywania

world:
  expected_players: 50     # skala wspólnych pul głębokich (pule rosną z liczbą graczy w sezonie)
  radius_km: 6371          # stylizowana kula, bez nazw
  min_silo_distance_km: 300
  placement_candidates: 20 # best-candidate sampling: wybieramy najdalszy od sąsiadów

upgrades:
  max_level: 10            # Warsztat, Wartownia, Laboratorium, Radiostacja do 10 (Laboratorium 10 = maks. skrócenie badań −45%)
  max_level_by_building: { szyb_glowny: 8, generator_pary: 8, magazyn: 8 }   # budynki produkcyjne zostają na 8 (bez eksplozji dochodu)
  cost_growth: 1.6         # koszt(L) = base_cost * cost_growth^(L-1), L = poziom docelowy
  time_base_seconds: 180   # czas(L) = time_base * time_growth^(L-2); L2 = 3 min ... L8 ≈ 3,2 h
  time_growth: 2.0
  queue_slots: 1

progression:
  xp_base: 12              # XP z poziomu L na L+1 = xp_base * L^xp_exp
  xp_exp: 2.2
  max_level: 30
  points_per_level: 3

# Zjazdy w strefy Rdzeniowców. Nagroda rudy pochodzi z WSPÓLNEJ, ukrytej puli strefy.
# Nagrody liczone z czasu trasy: ruda = ore_per_min * minuty * efektywność(minuty) * (1 ± spread).
# efektywność: krótka trasa (min_route_minutes) = 1 + short_bonus, najdłuższa (reference_minutes) = 1.0, pomiędzy log-liniowo.
# Dzięki temu suma krótkich zjazdów jest ok. 20% bardziej opłacalna niż jeden długi na ten sam czas, ale długie są wygodniejsze.
dives:
  queue_slots: { free: 2, subscriber: 3 }   # liczba zjazdów w kolejce (trwający + oczekujące)
  fail_reward_fraction: 0.3   # porażka daje 30% XP i nagrody
  winded_seconds: 300         # "zadyszka" po porażce blokuje DODAWANIE nowych zjazdów do kolejki
  pool_floor_fraction: 0.10   # poniżej 10% puli nagroda = 10% (ślady), bez dalszego ubywania puli
  economy:
    ore_per_min: 1.5
    xp_per_min: 1.0
    short_bonus: 0.20         # premia krótkich tras względem najdłuższej (15–20%)
    reference_minutes: 480
    min_route_minutes: 3
    spread: 0.2               # losowość nagrody ±20%
  # Dwie wspólne, ukryte pule rudy. Każdy nowy silos dokłada do nich swój udział (pool_per_player), więc spóźnieni gracze nie zastają pustych stref.
  zones:
    gorne:    { name: Górne strefy,    pool_per_player: 30000, regen_per_day: 0.005 }   # Płytki, Średni, Głęboki
    glebokie: { name: Głębokie strefy, pool_per_player: 48000, regen_per_day: 0.005 }   # Przepaść, Pełna zmiana
    jadro:    { name: Strefa rdzenia,  pool_per_player: 150000, regen_per_day: 0.003 }  # trasy od poziomu 9: nagroda × reward_mult
  routes:
    - { id: plytki,       name: Płytki,       zone: gorne,    min_level: 1, seconds: 180,   steam: 3,  difficulty: 2.5,  tokens: [0, 0] }
    - { id: sredni,       name: Średni,       zone: gorne,    min_level: 2, seconds: 900,   steam: 10, difficulty: 4.0,  tokens: [0, 2] }
    - { id: gleboki,      name: Głęboki,      zone: gorne,    min_level: 3, seconds: 3600,  steam: 22, difficulty: 5.5,  tokens: [4, 10], samples: [0, 1] }
    - { id: przepasc,     name: Przepaść,     zone: glebokie, min_level: 5, seconds: 14400, steam: 45, difficulty: 8.0,  tokens: [20, 40], samples: [0, 1] }
    - { id: pelna_zmiana, name: Pełna zmiana, zone: glebokie, min_level: 7, seconds: 28800, steam: 70, difficulty: 11.0, tokens: [45, 80], samples: [0, 1] }
    # --- trasy wysokich poziomów: strefa rdzenia, trudność rośnie do końca drabinki poziomów (reward_mult = mnożnik rudy i XP)
    - { id: szczeliny,    name: Szczeliny,        zone: jadro, min_level: 9,  seconds: 1200,  steam: 13,  difficulty: 15.0, reward_mult: 1.3, tokens: [8, 16],   samples: [0, 0] }
    - { id: komin,        name: Komin żarowy,     zone: jadro, min_level: 12, seconds: 5400,  steam: 30,  difficulty: 20.0, reward_mult: 1.45, tokens: [18, 32], samples: [0, 0] }
    - { id: sztolnia,     name: Sztolnia echa,    zone: jadro, min_level: 14, seconds: 1800,  steam: 16,  difficulty: 25.0, reward_mult: 1.6, tokens: [14, 26],  samples: [0, 0] }
    - { id: labirynt,     name: Labirynt łusek,   zone: jadro, min_level: 17, seconds: 14400, steam: 55,  difficulty: 31.0, reward_mult: 1.8, tokens: [40, 70],  samples: [0, 1] }
    - { id: brama,        name: Brama Starszych,  zone: jadro, min_level: 20, seconds: 28800, steam: 85,  difficulty: 38.0, reward_mult: 2.1, tokens: [80, 130], samples: [0, 1] }
    - { id: serce,        name: Serce rdzenia,    zone: jadro, min_level: 25, seconds: 43200, steam: 105, difficulty: 48.0, reward_mult: 2.5, tokens: [120, 200], samples: [0, 1] }

effects:
  ore_per_hour: { base: 40, growth: 1.3 }                 # Szyb główny
  steam: { cap_base: 100, cap_step: 25, regen_base: 1, regen_step: 0.2 }   # Generator pary (regen w parze/min)
  warehouse: { cap_base: 1000, cap_growth: 1.5, protected_step: 0.10, protected_max: 0.6 }
  watchtower: { defense_step: 3 }

buildings:
  - { id: szyb_glowny, name: Szyb główny, base_cost: 50 }
  - { id: generator_pary, name: Generator pary, base_cost: 60 }
  - { id: magazyn, name: Magazyn, base_cost: 40 }
  - { id: warsztat, name: Warsztat, base_cost: 80 }
  - { id: wartownia, name: Wartownia, base_cost: 70 }
  - { id: laboratorium, name: Laboratorium, base_cost: 90 }
  - { id: radiostacja, name: Radiostacja, base_cost: 110 }

archetypes:
  - id: gornik
    name: Górnik
    stats: { sila: 5, technika: 3, percepcja: 2, wytrwalosc: 4 }
    dive_ore_multiplier: 1.1
  - id: inzynier
    name: Inżynier
    stats: { sila: 2, technika: 5, percepcja: 3, wytrwalosc: 3 }
    upgrade_cost_multiplier: 0.9
  - id: zwiadowca
    name: Zwiadowca
    stats: { sila: 3, technika: 3, percepcja: 5, wytrwalosc: 2 }
    dive_steam_multiplier: 0.9
  - id: alchemik
    name: Alchemik
    stats: { sila: 2, technika: 4, percepcja: 3, wytrwalosc: 4 }

# Warsztat: przedmioty dają bonus do mocy zjazdu (a więc do szansy), zużywają się i wymagają napraw
items:
  inventory_max: 24
  repair_cost_fraction: 0.18       # pełna naprawa = ta część kosztu rudy receptury (proporcjonalnie do ubytku)
  quality: { min: 0.85, max: 1.05, min_step: 0.02, max_step: 0.04 }   # zakres jakości rośnie z poziomem Warsztatu
  slots: [narzedzie, ochrona, lampa, sprzet]
  # Wzmacnianie: stały cel dla rudy i materiałów w późnej grze. Tier t wymaga Warsztatu (workshop_base + t) i Radiostacji `radio`.
  upgrade:
    max_tier: 5
    workshop_base: 5
    radio: 5
    ore_fraction: 0.6        # koszt rudy tieru 1 = ruda receptury × 0,6; każdy kolejny tier × growth
    growth: 1.7
    tokens_per_tier: 15
    materials_per_tier: { miedz: 6, krysztal: 5, siarka: 4 }   # × numer tieru
    bonus_per_tier: 0.10     # +10% bonusu przedmiotu za tier
    repair_per_tier: 0.15    # +15% kosztu naprawy za tier
  recipes:   # tech: receptura odblokowana badaniem w Laboratorium
    - { id: kilof,               name: Kilof,                slot: narzedzie, workshop: 1, ore: 150,  tokens: 0,  bonus: 0.6, durability: 20 }
    - { id: mlot_pneumatyczny,   name: Młot pneumatyczny,    slot: narzedzie, workshop: 3, ore: 600,  tokens: 4,  bonus: 1.0, durability: 25 }
    - { id: wiertlo_udarowe,     name: Wiertło udarowe,      slot: narzedzie, workshop: 4, ore: 1400, tokens: 12, bonus: 1.6, durability: 30, radio: 5, materials: { miedz: 15, krysztal: 6 } }
    - { id: wiertlo_rdzeniowe,   name: Wiertło rdzeniowe,    slot: narzedzie, workshop: 6, ore: 4500, tokens: 40, bonus: 2.6, durability: 40, radio: 5, materials: { miedz: 40, krysztal: 25 }, tech: wiertla_rdzeniowe }
    - { id: kask_gornika,        name: Kask górnika,         slot: ochrona,   workshop: 2, ore: 300,  tokens: 2,  bonus: 0.6, durability: 25 }
    - { id: helm_wzmocniony,     name: Hełm wzmocniony,      slot: ochrona,   workshop: 3, ore: 700,  tokens: 5,  bonus: 1.0, durability: 30, tech: metalurgia }
    - { id: kombinezon_pancerny, name: Kombinezon pancerny,  slot: ochrona,   workshop: 5, ore: 2000, tokens: 18, bonus: 1.5, durability: 35, radio: 5, materials: { miedz: 20, siarka: 8 } }
    - { id: kombinezon_izolowany, name: Kombinezon izolowany, slot: ochrona,  workshop: 7, ore: 5500, tokens: 50, bonus: 2.4, durability: 45, radio: 5, materials: { siarka: 35, krysztal: 20 }, tech: izolacja_rdzenia }
    - { id: lampa_karbidowa,     name: Lampa karbidowa,      slot: lampa,     workshop: 1, ore: 200,  tokens: 0,  bonus: 0.5, durability: 20 }
    - { id: lampa_wibracyjna,    name: Lampa wibracyjna,     slot: lampa,     workshop: 3, ore: 800,  tokens: 8,  bonus: 1.2, durability: 30 }
    - { id: lampa_rezonansowa,   name: Lampa rezonansowa,    slot: lampa,     workshop: 6, ore: 3800, tokens: 35, bonus: 2.0, durability: 40, radio: 5, materials: { krysztal: 25, siarka: 10 }, tech: rezonans_skal }
    - { id: detektor_zylowy,     name: Detektor żył,         slot: sprzet,    workshop: 2, ore: 450,  tokens: 3,  bonus: 0.7, durability: 25 }
    - { id: skaner_sejsmiczny,   name: Skaner sejsmiczny,    slot: sprzet,    workshop: 5, ore: 2600, tokens: 22, bonus: 1.6, durability: 35, radio: 5, materials: { miedz: 18, krysztal: 15 }, tech: sejsmika }

# Dział nauki (Laboratorium): jedno badanie naraz; czas skraca się o 5% za każdy poziom Laboratorium (max −50%)
research:
  lab_time_step: 0.05
  techs:
    - { id: geologia_1,        name: Geologia I,            branch: gornictwo, lab: 1, ore: 200,  tokens: 0,  seconds: 600,   effect: { dive_ore_pct: 3 } }
    - { id: geologia_2,        name: Geologia II,           branch: gornictwo, lab: 3, ore: 900,  tokens: 6,  seconds: 3600,  requires: [geologia_1], effect: { dive_ore_pct: 4 } }
    - { id: geologia_3,        name: Geologia III,          branch: gornictwo, lab: 5, ore: 3500, tokens: 25, seconds: 14400, radio: 5, materials: { miedz: 20 }, requires: [geologia_2], effect: { dive_ore_pct: 5 } }
    - { id: sejsmika,          name: Sejsmika,              branch: gornictwo, lab: 3, ore: 800,  tokens: 5,  seconds: 3600,  requires: [geologia_1], effect: { dive_power: 0.3 }, unlocks: [skaner_sejsmiczny] }
    - { id: hydraulika_1,      name: Hydraulika I,          branch: inzynieria, lab: 1, ore: 250,  tokens: 0,  seconds: 900,   effect: { dive_steam_pct: -4 } }
    - { id: hydraulika_2,      name: Hydraulika II,         branch: inzynieria, lab: 4, ore: 1500, tokens: 10, seconds: 7200, radio: 5, materials: { krysztal: 12 },  requires: [hydraulika_1], effect: { dive_steam_pct: -4 } }
    - { id: ekonomika_prac_1,  name: Organizacja robót I,   branch: inzynieria, lab: 2, ore: 400,  tokens: 0,  seconds: 1800,  effect: { upgrade_cost_pct: -5 } }
    - { id: ekonomika_prac_2,  name: Organizacja robót II,  branch: inzynieria, lab: 5, ore: 2500, tokens: 15, seconds: 10800, radio: 5, materials: { miedz: 15, siarka: 8 }, requires: [ekonomika_prac_1], effect: { upgrade_cost_pct: -5 } }
    - { id: metalurgia,        name: Metalurgia,            branch: inzynieria, lab: 2, ore: 500,  tokens: 3,  seconds: 1800,  effect: { repair_pct: -10 }, unlocks: [helm_wzmocniony] }
    - { id: precyzja,          name: Precyzyjna obróbka,    branch: inzynieria, lab: 3, ore: 1000, tokens: 6,  seconds: 5400,  requires: [metalurgia], effect: { quality: 0.04 } }
    # --- gałąź Rdzeniowców: próbki rdzeniowe pochodzą ze zjazdów w głębokich strefach ---
    - { id: obserwacja_rdzeniowcow, name: Obserwacja Rdzeniowców, branch: rdzeniowcy, lab: 3, ore: 700,  tokens: 4,  samples: 3,  seconds: 5400,  requires: [sejsmika] }
    - { id: rezonans_skal,      name: Rezonans skał,          branch: rdzeniowcy, lab: 4, ore: 1800, tokens: 14, samples: 4,  seconds: 9000,  requires: [obserwacja_rdzeniowcow], effect: { dive_power: 0.3 }, unlocks: [lampa_rezonansowa] }
    - { id: anatomia_rdzeniowcow, name: Anatomia Rdzeniowców, branch: rdzeniowcy, lab: 4, ore: 1500, tokens: 10, samples: 8,  seconds: 9000,  requires: [obserwacja_rdzeniowcow], effect: { samples_pct: 20 } }
    - { id: jezyk_wibracji_1,   name: Język wibracji I,       branch: rdzeniowcy, lab: 4, ore: 2000, tokens: 15, samples: 6,  seconds: 10800, requires: [obserwacja_rdzeniowcow], effect: { winded_pct: -25 } }
    - { id: jezyk_wibracji_2,   name: Język wibracji II,      branch: rdzeniowcy, lab: 5, ore: 3500, tokens: 25, samples: 12, seconds: 16200, radio: 5, materials: { krysztal: 15 }, requires: [jezyk_wibracji_1, rezonans_skal], effect: { winded_pct: -25, dive_power: 0.3 } }
    - { id: jezyk_wibracji_3,   name: Język wibracji III,     branch: rdzeniowcy, lab: 6, ore: 6000, tokens: 40, samples: 35, seconds: 28800, radio: 5, materials: { krysztal: 30, siarka: 20 }, requires: [jezyk_wibracji_2, anatomia_rdzeniowcow], effect: { dive_power: 0.4 } }
    - { id: wiertla_rdzeniowe,  name: Wiertła rdzeniowe,      branch: rdzeniowcy, lab: 5, ore: 3200, tokens: 22, samples: 10, seconds: 14400, radio: 5, materials: { miedz: 25, krysztal: 15 }, requires: [metalurgia, rezonans_skal], unlocks: [wiertlo_rdzeniowe] }
    - { id: izolacja_rdzenia,   name: Izolacja przed rdzeniem, branch: rdzeniowcy, lab: 6, ore: 4500, tokens: 35, samples: 25, seconds: 21600, radio: 5, materials: { siarka: 25, miedz: 15 }, requires: [metalurgia, anatomia_rdzeniowcow], effect: { dive_power: 0.3 }, unlocks: [kombinezon_izolowany] }

# Kodeks Rdzeniowców: wpisy odkrywane badaniami (fabuła; gracz poznaje gatunek stopniowo)
codex:
  - { id: pierwszy_slad, tech: obserwacja_rdzeniowcow, title: Pierwszy ślad, text: "Drgania, które brałeś za pracę skał, mają rytm. Powtarzają się w tych samych odstępach i zawsze z tego samego kierunku — z dołu. Coś tam jest i nie jest to maszyna: nie słychać żadnego silnika, tylko ciężki, powolny puls." }
  - { id: gniazda, tech: obserwacja_rdzeniowcow, title: Gniazda, text: "Obserwacje z kilku zjazdów układają się w obraz: istoty żyją gromadnie przy żyłach gorąca. Nie budują — drążą. Nie znają metalu ani ognia, ale ich korytarze są dziwnie regularne. Nazywamy je Rdzeniowcami, bo nikt nie widział ich wyżej niż kilka kilometrów od jądra." }
  - { id: piesn_kamienia, tech: rezonans_skal, title: Pieśń kamienia, text: "Rdzeniowcy nie mają głosu. Mówią skałą: uderzają, tarą, wprawiają ją w drżenie, które niesie się przez kilometry litej warstwy. Nasze lampy wibracyjne rejestrują to jako szum; dostrojone do ich pasma zaczynają tworzyć wzory." }
  - { id: cialo_z_zaru, tech: anatomia_rdzeniowcow, title: Ciało z żaru, text: "Próbki nie przypominają niczego znanego: skorupa z mineralnej łuski, wnętrze utrzymujące temperaturę, w której stopiłby się nasz hełm. To nie zwierzęta. Narzędzia z kości, których tu nie ma, byłyby zresztą zbędne — ich dłonie są narzędziami." }
  - { id: pierwsze_slowa, tech: jezyk_wibracji_1, title: Pierwsze słowa, text: "Trzy wzory powtarzają się najczęściej. Jeden towarzyszy cieple, drugi ruchowi w głąb, trzeci pojawia się tuż przed tym, nim dzieje się coś złego. Ten ostatni zapisaliśmy jako: OBCY. To my." }
  - { id: granica, tech: jezyk_wibracji_2, title: Granica, text: "Wzór, który uważaliśmy za agresję, to ostrzeżenie. Rdzeniowcy wyznaczają granice drganiami, a nasze najgłębsze zjazdy przekraczają je bez pytania. Zadyszka po nieudanym zjeździe nie jest jednak karą — to skutek zderzenia ze ścianą dźwięku, którą budują, żebyśmy zawrócili." }
  - { id: echo_z_gory, tech: jezyk_wibracji_2, title: Echo z góry, text: "W zapisach jest coś, co nie pasuje do Rdzeniowców: regularne, sztuczne impulsy dochodzące z boku, z ogromnej odległości. Zbyt równe, by były naturalne, zbyt słabe, by były ich dziełem. Ktoś jeszcze drąży w tej skorupie." }
  - { id: starsi, tech: jezyk_wibracji_3, title: Starsi, text: "Najgłębsze wzory mają jedno źródło. Kiedy ono mówi, reszta milknie. Rdzeniowcy nazywają je w swoim języku czymś, co oddajemy jako STARSZY. Jest ich niewielu, są najstarsi i najgłębiej — a to, co chroni jądro, chroni też coś, o czym nie wiemy jeszcze nic." }
  - { id: cena_wiertla, tech: wiertla_rdzeniowe, title: Cena wiertła, text: "Wiertło rdzeniowe działa, bo wibruje w paśmie, które skała znosi najlepiej. Dla Rdzeniowców brzmi to jak krzyk. Możemy z niego korzystać. Pytanie, czy powinniśmy." }
  - { id: cieplo_rdzenia, tech: izolacja_rdzenia, title: Ciepło rdzenia, text: "Kombinezon izolowany pozwala zejść głębiej, niż jakikolwiek człowiek schodził. Na dole nie ma ciemności, jakiej się spodziewano — jest ciepłe, bursztynowe światło i dźwięk, który czuć w kościach. Rdzeniowcy nie atakują. Czekają, aż wyjaśnimy, po co przyszliśmy." }

# Radiostacja: poziom budynku 1 = izolacja (nic nie słychać, nikt nie słyszy). Wyższe poziomy odblokowują łączność.
radio:
  levels: { receiver: 2, transmitter: 3, cipher: 4, relays: 5 }   # minimalny poziom budynku dla każdej zdolności
  r0_km: 5000              # zasięg nasłuchu na poziomie Odbiornika; × range_growth za każdy kolejny poziom
  range_growth: 1.6
  cipher_range_reduction: 0.35   # szyfr: tyle krócej inni Cię słyszą
  contact_steam: 8         # koszt namierzenia (nawiązania kontaktu) z nasłuchiwanym silosem
  distance_band_km: 500    # słyszany dystans jest zaokrąglany do tego kroku
  speed_km_per_min: 1000   # czas dojazdu najazdu = dystans / prędkość, w granicach poniżej
  travel_min: 2
  travel_max: 20

# Najazdy (PvP async). Rozstrzygnięcie: A = Siła + 0.4·Percepcja, D = Wytrwałość + 3·poziom Wartowni; P = 1 / (1 + e^(−3·ln(A/D)))
raids:
  min_level: 5                  # najazd możliwy od tego poziomu
  beginner_protection_level: 4  # gracze poniżej tego poziomu nie mogą być celem
  steam: 30
  league_tolerance: 0.4         # moc celu w przedziale ±40% mocy atakującego
  loot_fraction: 0.05           # część NIECHRONIONEJ rudy i żetonów obrońcy
  loot_cap_ore: 3000
  loot_cap_tokens: 80
  protection_minutes: 360       # ochrona obrońcy po przegranej
  same_target_cooldown_minutes: 180
  same_target_per_day: 3
  attacker_per_day: 5
  xp_win: 14
  xp_loss: 4
  defender_xp_win: 6

# Sezony: ok. 180 dni, potem podsumowanie (przerwa) i reset świata. Konto, tytuły i mały bonus startowy zostają.
# Nagrody wg miejsca w rankingu mocy; pierwsza pasująca. Bonus to wygoda na starcie (ruda), nie przewaga w walce.
season:
  length_days: 180
  intermission_hours: 48
  max_bonus_ore: 500
  rewards:
    - { id: mistrz_glebi,    name: Mistrz Głębi,    max_rank: 1,      start_bonus_ore: 400 }
    - { id: starszy_sztygar, name: Starszy sztygar, top_percent: 10,  min_level: 10, start_bonus_ore: 300 }
    - { id: sztygar,         name: Sztygar,         top_percent: 33,  min_level: 10, start_bonus_ore: 200 }
    - { id: weteran,         name: Weteran sezonu,  top_percent: 100, min_level: 5,  start_bonus_ore: 100 }

# Geologia i materiały. Regionalny profil silosu wynika z jego położenia na kuli (gładkie pola → sąsiedzi mają podobny profil),
# gracz widzi tylko jakościowy opis. Materiały są WYMAGANE dopiero od Radiostacji poz. 5 (receptury i badania z `radio: 5`),
# więc do tego momentu różnorodność surowców prawie nie wpływa na grę.
geology:
  materials: [miedz, krysztal, siarka]
  richness: { main: 1.0, secondary: 0.4, trace: 0.1 }   # mnożnik wydobycia dla najbogatszego / drugiego / trzeciego materiału w regionie
  mat_per_hour: 0.5          # materiał z godziny zjazdu (× reward_mult trasy × bogactwo); porażka daje fail_reward_fraction tej ilości
  min_route_level: 3         # trasy poniżej tego poziomu nie dają materiałów
  local_variance: 0.2        # losowe ±20% per silos
  field_frequency: 2.2       # mniejsza = większe regiony
  field_seed: 20260101

# Wymiana z Handlarzem Przekaźnikowym (NPC) – gwarantuje, że brak lokalnego materiału nie blokuje gry, i wyznacza sufit cen rynku.
# Tylko kupno za rudę (ruda ginie, materiały powstają); od Radiostacji poz. 5.
exchange:
  radio: 5
  buy_ore: { miedz: 140, krysztal: 160, siarka: 150 }
