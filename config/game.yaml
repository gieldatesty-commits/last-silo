# Konfiguracja gry Last Silo. Wartości startowe do strojenia w symulatorze (server: npm run sim).
version: "0.5.0"

resources:
  - { id: ore, name: Ruda }
  - { id: steam, name: Para }
  - { id: tokens, name: Żetony }

economy:
  start_ore: 300
  deposit:
    local_total: 15000     # ukryta, bazowa wielkość złoża pod silosem (rudy)
    variance: 0.4          # losowanie ±40%
    floor_fraction: 0.15   # poniżej 15% złoża wydajność = 15% bazowej (ślady rudy), bez dalszego ubywania

world:
  expected_players: 50     # skala wspólnych pul głębokich (pule rosną z liczbą graczy w sezonie)
  radius_km: 6371          # stylizowana kula, bez nazw
  min_silo_distance_km: 300
  placement_candidates: 20 # best-candidate sampling: wybieramy najdalszy od sąsiadów

upgrades:
  max_level: 8
  cost_growth: 1.6         # koszt(L) = base_cost * cost_growth^(L-1), L = poziom docelowy
  time_base_seconds: 180   # czas(L) = time_base * time_growth^(L-2); L2 = 3 min ... L8 ≈ 3,2 h
  time_growth: 2.0
  queue_slots: 1

progression:
  xp_base: 12              # XP z poziomu L na L+1 = xp_base * L^xp_exp
  xp_exp: 2.0
  max_level: 30
  points_per_level: 3

# Zjazdy w strefy Rdzeniowców. Nagroda rudy pochodzi z WSPÓLNEJ, ukrytej puli strefy.
# Nagrody liczone z czasu trasy: ruda = ore_per_min * minuty * efektywność(minuty) * (1 ± spread).
# efektywność: krótka trasa (min_route_minutes) = 1 + short_bonus, najdłuższa (reference_minutes) = 1.0, pomiędzy log-liniowo.
# Dzięki temu suma krótkich zjazdów jest ok. 20% bardziej opłacalna niż jeden długi na ten sam czas, ale długie są wygodniejsze.
dives:
  queue_slots: { free: 2, subscriber: 3 }   # liczba zjazdów w kolejce (trwający + oczekujące)
  fail_reward_fraction: 0.3   # porażka daje 30% XP i nagrody
  winded_seconds: 300         # "zadyszka" po porażce blokuje DODAWANIE nowych zjazdów do kolejki
  pool_floor_fraction: 0.10   # poniżej 10% puli nagroda = 10% (ślady), bez dalszego ubywania puli
  economy:
    ore_per_min: 1.6
    xp_per_min: 1.0
    short_bonus: 0.20         # premia krótkich tras względem najdłuższej (15–20%)
    reference_minutes: 480
    min_route_minutes: 3
    spread: 0.2               # losowość nagrody ±20%
  # Dwie wspólne, ukryte pule rudy. Każdy nowy silos dokłada do nich swój udział (pool_per_player), więc spóźnieni gracze nie zastają pustych stref.
  zones:
    gorne:    { name: Górne strefy,    pool_per_player: 30000 }   # Płytki, Średni, Głęboki
    glebokie: { name: Głębokie strefy, pool_per_player: 48000 }   # Przepaść, Pełna zmiana
  routes:
    - { id: plytki,       name: Płytki,       zone: gorne,    min_level: 1, seconds: 180,   steam: 3,  difficulty: 2.5,  tokens: [0, 0] }
    - { id: sredni,       name: Średni,       zone: gorne,    min_level: 2, seconds: 900,   steam: 10, difficulty: 4.0,  tokens: [0, 2] }
    - { id: gleboki,      name: Głęboki,      zone: gorne,    min_level: 3, seconds: 3600,  steam: 22, difficulty: 5.5,  tokens: [4, 10] }
    - { id: przepasc,     name: Przepaść,     zone: glebokie, min_level: 5, seconds: 14400, steam: 45, difficulty: 8.0,  tokens: [20, 40] }
    - { id: pelna_zmiana, name: Pełna zmiana, zone: glebokie, min_level: 7, seconds: 28800, steam: 70, difficulty: 11.0, tokens: [45, 80] }

effects:
  ore_per_hour: { base: 40, growth: 1.3 }                 # Szyb główny
  steam: { cap_base: 100, cap_step: 25, regen_base: 1, regen_step: 0.2 }   # Generator pary (regen w parze/min)
  warehouse: { cap_base: 1000, cap_growth: 1.5, protected_step: 0.10, protected_max: 0.6 }
  watchtower: { defense_step: 3 }

buildings:
  - { id: szyb_glowny, name: Szyb główny, base_cost: 50 }
  - { id: generator_pary, name: Generator pary, base_cost: 60 }
  - { id: magazyn, name: Magazyn, base_cost: 40 }
  - { id: warsztat, name: Warsztat, base_cost: 80 }
  - { id: wartownia, name: Wartownia, base_cost: 70 }
  - { id: laboratorium, name: Laboratorium, base_cost: 90 }

archetypes:
  - id: gornik
    name: Górnik
    stats: { sila: 5, technika: 3, percepcja: 2, wytrwalosc: 4 }
    dive_ore_multiplier: 1.1
  - id: inzynier
    name: Inżynier
    stats: { sila: 2, technika: 5, percepcja: 3, wytrwalosc: 3 }
    upgrade_cost_multiplier: 0.9
  - id: zwiadowca
    name: Zwiadowca
    stats: { sila: 3, technika: 3, percepcja: 5, wytrwalosc: 2 }
    dive_steam_multiplier: 0.9
  - id: alchemik
    name: Alchemik
    stats: { sila: 2, technika: 4, percepcja: 3, wytrwalosc: 4 }

# Warsztat: przedmioty dają bonus do mocy zjazdu (a więc do szansy), zużywają się i wymagają napraw
items:
  inventory_max: 24
  repair_cost_fraction: 0.4        # pełna naprawa = ta część kosztu rudy receptury (proporcjonalnie do ubytku)
  quality: { min: 0.85, max: 1.05, min_step: 0.02, max_step: 0.04 }   # zakres jakości rośnie z poziomem Warsztatu
  slots: [narzedzie, ochrona, lampa, sprzet]
  recipes:   # tech: receptura odblokowana badaniem w Laboratorium
    - { id: kilof,               name: Kilof,                slot: narzedzie, workshop: 1, ore: 150,  tokens: 0,  bonus: 0.6, durability: 20 }
    - { id: mlot_pneumatyczny,   name: Młot pneumatyczny,    slot: narzedzie, workshop: 3, ore: 600,  tokens: 4,  bonus: 1.0, durability: 25 }
    - { id: wiertlo_udarowe,     name: Wiertło udarowe,      slot: narzedzie, workshop: 4, ore: 1400, tokens: 12, bonus: 1.6, durability: 30 }
    - { id: wiertlo_rdzeniowe,   name: Wiertło rdzeniowe,    slot: narzedzie, workshop: 6, ore: 4500, tokens: 40, bonus: 2.6, durability: 40, tech: wiertla_rdzeniowe }
    - { id: kask_gornika,        name: Kask górnika,         slot: ochrona,   workshop: 2, ore: 300,  tokens: 2,  bonus: 0.6, durability: 25 }
    - { id: helm_wzmocniony,     name: Hełm wzmocniony,      slot: ochrona,   workshop: 3, ore: 700,  tokens: 5,  bonus: 1.0, durability: 30, tech: metalurgia }
    - { id: kombinezon_pancerny, name: Kombinezon pancerny,  slot: ochrona,   workshop: 5, ore: 2000, tokens: 18, bonus: 1.5, durability: 35 }
    - { id: kombinezon_izolowany, name: Kombinezon izolowany, slot: ochrona,  workshop: 7, ore: 5500, tokens: 50, bonus: 2.4, durability: 45, tech: izolacja_rdzenia }
    - { id: lampa_karbidowa,     name: Lampa karbidowa,      slot: lampa,     workshop: 1, ore: 200,  tokens: 0,  bonus: 0.5, durability: 20 }
    - { id: lampa_wibracyjna,    name: Lampa wibracyjna,     slot: lampa,     workshop: 3, ore: 800,  tokens: 8,  bonus: 1.2, durability: 30 }
    - { id: lampa_rezonansowa,   name: Lampa rezonansowa,    slot: lampa,     workshop: 6, ore: 3800, tokens: 35, bonus: 2.0, durability: 40, tech: rezonans_skal }
    - { id: detektor_zylowy,     name: Detektor żył,         slot: sprzet,    workshop: 2, ore: 450,  tokens: 3,  bonus: 0.7, durability: 25 }
    - { id: skaner_sejsmiczny,   name: Skaner sejsmiczny,    slot: sprzet,    workshop: 5, ore: 2600, tokens: 22, bonus: 1.6, durability: 35, tech: sejsmika }

# Dział nauki (Laboratorium): jedno badanie naraz; czas skraca się o 5% za każdy poziom Laboratorium (max −50%)
research:
  lab_time_step: 0.05
  techs:
    - { id: geologia_1,        name: Geologia I,            branch: gornictwo, lab: 1, ore: 200,  tokens: 0,  seconds: 600,   effect: { dive_ore_pct: 3 } }
    - { id: geologia_2,        name: Geologia II,           branch: gornictwo, lab: 3, ore: 900,  tokens: 6,  seconds: 3600,  requires: [geologia_1], effect: { dive_ore_pct: 4 } }
    - { id: geologia_3,        name: Geologia III,          branch: gornictwo, lab: 5, ore: 3500, tokens: 25, seconds: 14400, requires: [geologia_2], effect: { dive_ore_pct: 5 } }
    - { id: sejsmika,          name: Sejsmika,              branch: gornictwo, lab: 3, ore: 800,  tokens: 5,  seconds: 3600,  requires: [geologia_1], effect: { dive_power: 0.3 }, unlocks: [skaner_sejsmiczny] }
    - { id: hydraulika_1,      name: Hydraulika I,          branch: inzynieria, lab: 1, ore: 250,  tokens: 0,  seconds: 900,   effect: { dive_steam_pct: -4 } }
    - { id: hydraulika_2,      name: Hydraulika II,         branch: inzynieria, lab: 4, ore: 1500, tokens: 10, seconds: 7200,  requires: [hydraulika_1], effect: { dive_steam_pct: -4 } }
    - { id: ekonomika_prac_1,  name: Organizacja robót I,   branch: inzynieria, lab: 2, ore: 400,  tokens: 0,  seconds: 1800,  effect: { upgrade_cost_pct: -5 } }
    - { id: ekonomika_prac_2,  name: Organizacja robót II,  branch: inzynieria, lab: 5, ore: 2500, tokens: 15, seconds: 10800, requires: [ekonomika_prac_1], effect: { upgrade_cost_pct: -5 } }
    - { id: metalurgia,        name: Metalurgia,            branch: inzynieria, lab: 2, ore: 500,  tokens: 3,  seconds: 1800,  effect: { repair_pct: -10 }, unlocks: [helm_wzmocniony] }
    - { id: precyzja,          name: Precyzyjna obróbka,    branch: inzynieria, lab: 3, ore: 1000, tokens: 6,  seconds: 5400,  requires: [metalurgia], effect: { quality: 0.04 } }
    - { id: rezonans_skal,     name: Rezonans skał,         branch: rdzeniowcy, lab: 4, ore: 1800, tokens: 14, seconds: 9000,  requires: [sejsmika], effect: { dive_power: 0.3 }, unlocks: [lampa_rezonansowa] }
    - { id: wiertla_rdzeniowe, name: Wiertła rdzeniowe,     branch: rdzeniowcy, lab: 5, ore: 3200, tokens: 22, seconds: 14400, requires: [metalurgia, rezonans_skal], unlocks: [wiertlo_rdzeniowe] }
    - { id: izolacja_rdzenia,  name: Izolacja przed rdzeniem, branch: rdzeniowcy, lab: 6, ore: 4500, tokens: 35, seconds: 21600, requires: [metalurgia, rezonans_skal], effect: { dive_power: 0.3 }, unlocks: [kombinezon_izolowany] }
