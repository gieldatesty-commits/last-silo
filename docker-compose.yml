services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: szyb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw w .env}
      POSTGRES_DB: szyb7
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U szyb -d szyb7"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://szyb:${POSTGRES_PASSWORD}@db:5432/szyb7
      JWT_SECRET: ${JWT_SECRET:?ustaw w .env}
      PORT: 3000

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
