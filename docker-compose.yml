services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lastsilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw w .env}
      POSTGRES_DB: lastsilo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastsilo -d lastsilo"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://lastsilo:${POSTGRES_PASSWORD}@db:5432/lastsilo
      JWT_SECRET: ${JWT_SECRET:?ustaw w .env}
      PORT: 3000
      # płatności (opcjonalne, wszystkie albo żadna)
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      RTDN_AUDIENCE: ${RTDN_AUDIENCE:-}
      RTDN_SERVICE_ACCOUNT_EMAIL: ${RTDN_SERVICE_ACCOUNT_EMAIL:-}
      BILLING_ACCOUNT_KEY: ${BILLING_ACCOUNT_KEY:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
