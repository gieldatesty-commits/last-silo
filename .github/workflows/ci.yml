name: CI
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lastsilo, POSTGRES_PASSWORD: lastsilo, POSTGRES_DB: lastsilo_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lastsilo" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: server } }
    env:
      TEST_DATABASE_URL: postgres://lastsilo:lastsilo@localhost:5432/lastsilo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
